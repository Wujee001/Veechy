name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          if ! command -v sdkmanager > /dev/null 2>&1; then
            echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          ls "${ANDROID_SDK_ROOT}/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # 失败时把编译错误打成注解，注解可匿名读取，便于定位
      - name: Report compile errors
        if: steps.build.outcome == 'failure'
        run: |
          MSG=$(grep -E "^(e: |FAILURE:|What went wrong)" /tmp/build.log | head -12 | tr '\n' '~' | cut -c1-6000)
          if [ -z "$MSG" ]; then
            MSG=$(tail -c 3000 /tmp/build.log | tr '\n' '~')
          fi
          echo "::error title=Build failed::$MSG"
          exit 1

      - name: Collect APK
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/WujeesAI-${GITHUB_REF_NAME}.apk"
          ls -lh out

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WujeesAI-apk
          path: out/*.apk
          retention-days: 30

      - name: Attach APK to Release
        if: steps.build.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
